# SPDX-License-Identifier: Apache-2.0
#
# CI for the CC3501E bridge firmware.
#
# What this CAN check, and what it deliberately cannot:
#
#   * The `ti` backend needs TI ticlang 5.1.1, the SimpleLink Wi-Fi SDK
#     10.10.01.08, SysConfig 1.28.0 and the Wi-Fi Toolbox 4.2.4 -- none of
#     which is redistributable, so no hosted runner can build it.  CI builds
#     the `stub` backend, which compiles every protocol/dispatch/event source
#     in the tree; only the hardware-touching HAL is replaced.  That still
#     catches the class of break that actually happens here: a protocol change
#     that does not compile, a handler that stops matching its table entry, a
#     header that drifts from alp-sdk.
#   * On-silicon behaviour is NOT covered.  The bench is a physical
#     E1M-AEN801 with an XDS110; nothing here substitutes for it.  A change
#     that alters radio, SPI-slave or OTA behaviour still needs a bench run
#     before it is believed.
#
# The protocol header comes from alp-sdk, not from this repo -- this firmware
# compiles the CANONICAL <alp/protocol/cc3501e.h> so the wire contract cannot
# fork.  That is why alp-sdk is checked out here and passed as ALP_SDK_ROOT.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: unit tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The wire contract lives in alp-sdk and this firmware compiles its
      # CANONICAL header rather than a mirror (ADR 0031), so the test needs it
      # too -- otherwise it could pass against a header this repo had drifted
      # from, which is the exact failure single-sourcing exists to prevent.
      - uses: actions/checkout@v4
        with:
          repository: alplabai/alp-sdk
          path: alp-sdk

      # This suite links the REAL firmware sources -- transport_spi.c, the nine
      # protocol_*.c dispatchers, worker.c, event_ring.c -- not mocks, so the
      # SPI framing and dispatch seams under test are the same code paths the
      # device runs.  It came from alp-sdk, where it ran under twister; the
      # firmware moved here and the test moved with it, because a test that
      # lives in a different repository from its subject is a test nobody runs.
      #
      # Host-only, no Zephyr: the code under test is freestanding C and only the
      # ztest harness was Zephyr-specific.  tests/unit/ztest_shim.h replaces it.
      # Linux specifically -- the firmware's weak default symbols do not resolve
      # under MinGW/PE.
      - name: configure
        run: cmake -S tests/unit -B build-tests -DALP_SDK_ROOT="$PWD/alp-sdk"

      - name: build
        run: cmake --build build-tests --parallel

      - name: run
        run: ctest --test-dir build-tests --output-on-failure

  stub-build:
    name: stub build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: firmware

      # The wire contract lives in alp-sdk.  Pinned to its default branch
      # deliberately: this build's whole point is to fail when the two drift,
      # and a pinned SHA here would hide exactly that.
      - uses: actions/checkout@v4
        with:
          repository: alplabai/alp-sdk
          path: alp-sdk

      # This is Cortex-M33 firmware -- the sources are compiled
      # -mcpu=cortex-m33 -mthumb unconditionally, so the host compiler cannot
      # build it even with the hardware-touching HAL stubbed.
      # toolchain/arm-none-eabi.cmake is the invocation CMakeLists.txt
      # documents for exactly this "CI compile smoke" case.
      - name: install the Arm GNU toolchain
        run: |
          sudo apt-get update -qq
          # libnewlib-arm-none-eabi is NOT optional and is a separate package
          # on Debian/Ubuntu: gcc-arm-none-eabi alone installs the compiler
          # with no C library headers, so the first #include <string.h> fails
          # with "No such file or directory" -- which reads like a source bug
          # and is not one.
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi
          arm-none-eabi-gcc --version | head -1
          # Prove the headers are reachable before CMake tries, so a packaging
          # regression reports itself here rather than as a confusing
          # "fatal error: string.h" against a source file.
          printf '#include <string.h>\nint main(void){return 0;}\n' > /tmp/hdr.c
          arm-none-eabi-gcc -mcpu=cortex-m33 -mthumb -c /tmp/hdr.c -o /tmp/hdr.o
          echo "newlib headers reachable"

      - name: configure
        run: |
          # CMAKE_TOOLCHAIN_FILE must be ABSOLUTE here.  CMake resolves a
          # relative toolchain path against the BUILD directory, not the
          # working directory, so "firmware/toolchain/..." was looked for at
          # "build/firmware/toolchain/..." and reported as
          # "Could not find toolchain file".
          # -Werror is passed HERE rather than baked into CMakeLists.txt so a
          # developer's local build still completes and shows its warnings.
          # CMakeLists already sets -Wall -Wextra -Wshadow -Wpedantic; without
          # -Werror every warning those produce merged green, which is the
          # entire reason this job "looked present and did not gate" (#11).
          cmake -B build -S firmware \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/firmware/toolchain/arm-none-eabi.cmake" \
            -DCC3501E_HAL_BACKEND=stub \
            -DALP_SDK_ROOT="$PWD/alp-sdk" \
            -DCMAKE_C_FLAGS="-Werror"

      - name: build
        run: cmake --build build -j"$(nproc)"

      # The SDIO branch of src/main.c was NEVER compiled by CI: only the
      # default -DCC3501E_CONTROL_TRANSPORT=spi was ever configured, while both
      # transports are advertised as always compiling.  A second configure is
      # cheap and is the only thing that makes that claim true (#11).
      - name: configure (SDIO transport)
        run: |
          cmake -B build-sdio -S firmware \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/firmware/toolchain/arm-none-eabi.cmake" \
            -DCC3501E_HAL_BACKEND=stub \
            -DALP_SDK_ROOT="$PWD/alp-sdk" \
            -DCC3501E_CONTROL_TRANSPORT=sdio \
            -DCMAKE_C_FLAGS="-Werror"

      - name: build (SDIO transport)
        run: cmake --build build-sdio -j"$(nproc)"

  protocol-vectors:
    name: wire vectors are regenerated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: firmware

      # tests/gen_protocol_vectors.py parses ALP_CC3501E_PROTOCOL_VERSION out of
      # alp-sdk's canonical header -- this firmware compiles that header rather
      # than a mirror, so the vectors have to be pinned against it, not against
      # a copy that can drift.
      - uses: actions/checkout@v4
        with:
          repository: alplabai/alp-sdk
          path: alp-sdk

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The script advertised this check in its own docstring and in README.md,
      # and NO job ran it -- so tests/protocol_vectors.txt was unpinned from the
      # moment this repo was extracted, and had in fact drifted: every reply
      # vector was missing the CC3501E_REPLY_PAD padding src/protocol.c applies,
      # so the "canonical" vectors described frames the firmware never emits
      # (#11).
      - name: regenerate and diff
        working-directory: firmware
        env:
          ALP_SDK_ROOT: ${{ github.workspace }}/alp-sdk
        run: |
          set -euo pipefail
          python3 tests/gen_protocol_vectors.py --check

  protocol-version-parity:
    name: protocol version parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: firmware
      - uses: actions/checkout@v4
        with:
          repository: alplabai/alp-sdk
          path: alp-sdk

      # Three numbers exist here and are NOT interchangeable (see
      # prebuilt/CHANGELOG.md): the app SemVer, the wire protocol, and the GPE
      # stamp on a flashed artifact.  This job pins the one that is a contract
      # with the host: protocol-version.txt must equal alp-sdk's
      # ALP_CC3501E_PROTOCOL_VERSION, and src/protocol_meta.c's compile-time
      # assert must agree too.  A mismatch is how a build answers GET_VERSION
      # with one number while behaving like another.
      # The wire version is MAJOR.MINOR since ADR 0033, and
      # ALP_CC3501E_PROTOCOL_VERSION is now the COMPOSED expression
      # `(MAJOR << 8) | MINOR` rather than a literal -- so the two halves are
      # read separately.  (A grep for digits after the old define name now
      # matches nothing, which would have made this gate pass vacuously.)
      - name: compare protocol-version.txt with the canonical header
        run: |
          set -euo pipefail
          hdr_file=alp-sdk/include/alp/protocol/cc3501e.h
          fw=$(tr -d '[:space:]' < firmware/protocol-version.txt)
          major=$(grep -oP '#define\s+ALP_CC3501E_PROTOCOL_MAJOR\s+\K[0-9]+' "$hdr_file" || true)
          minor=$(grep -oP '#define\s+ALP_CC3501E_PROTOCOL_MINOR\s+\K[0-9]+' "$hdr_file" || true)
          if [ -z "$major" ] || [ -z "$minor" ]; then
            echo "::error::cannot read ALP_CC3501E_PROTOCOL_MAJOR/_MINOR from $hdr_file."
            echo "A header carrying only a flat ALP_CC3501E_PROTOCOL_VERSION literal predates"
            echo "ADR 0033 and cannot be paired with this firmware."
            exit 1
          fi
          hdr="${major}.${minor}"
          echo "firmware/protocol-version.txt = $fw"
          echo "alp-sdk ALP_CC3501E_PROTOCOL_MAJOR.MINOR = $hdr"
          if [ "$fw" != "$hdr" ]; then
            echo "::error::protocol version mismatch: this tree says $fw, alp-sdk says $hdr."
            echo "Bump BOTH, in the same change, or the host and the companion disagree on the wire."
            echo "MAJOR moves only when an unchanged host would be MISREAD; additive changes are MINOR."
            exit 1
          fi

  clang-format:
    name: clang-format (diff only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Diff-only, not tree-wide: this tree carries vendor-shaped sources and
      # a tree-wide reformat would bury a real review in noise.
      - name: install clang-format 22
        run: pipx install "clang-format==22.1.5"

      - name: check changed C/H files
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base=$(git rev-parse HEAD~1); fi
          files=$(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.c' '*.h' || true)
          if [ -z "$files" ]; then echo "no C/H files changed"; exit 0; fi
          echo "$files"
          # shellcheck disable=SC2086
          clang-format --dry-run --Werror $files

  no-build-artifacts:
    name: no build artifacts or crash dumps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `git add -A` on the Windows bench has swept a 14 MB .out, a 2 MB .map
      # and several MSYS *.stackdump files into this history already.  Cheap to
      # check, expensive to undo.
      - name: reject tracked artifacts
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '\.(stackdump|out|map|o|obj)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::build artifacts / crash dumps are tracked:"
            echo "$bad"
            exit 1
          fi
          echo "clean"

  prebuilt-freshness:
    name: prebuilt freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the commit walk is the whole check; a shallow clone cannot do it
      # `prebuilt integrity` verifies each blob against its OWN .sha256.  That is
      # self-consistency, NOT currency: a prebuilt arbitrarily older than src/
      # passes it green, and that is exactly how cc3501e-v0.4.1.bin came to sit
      # 32 commits behind main while CI stayed clean (#75).  README tells
      # customers to flash that blob, so the property that matters to them is
      # whether it still corresponds to the source -- which nothing checked.
      #
      # Nothing is auto-forgiven: every firmware commit after `built-from` must
      # be listed in prebuilt/BUILT_FROM as `inert:`, a deliberate human claim
      # backed by a rebuild of `raw-sha256` (the stage-1, unwrapped output --
      # the shipped `image-sha256` is unreproducible by construction for a
      # WRAPPED release, #94/#92).  CI cannot check that claim itself --
      # rebuilding needs license-gated TI ticlang -- so the ledger's evidence
      # is the only thing standing behind it.
      #
      # This job is deliberately NOT in the branch ruleset's required contexts.
      # It should go RED when firmware lands without a release or an attestation,
      # because that is true and worth seeing; it must not block every unrelated
      # PR until someone can sign a new blob (the signing key is not in CI).
      #
      # The check itself lives in .github/scripts/check_prebuilt_freshness.py,
      # not inline here, for the same reason check_prebuilt_kind.py does: a
      # heredoc inside this file has already produced a YAML parse error once.
      - name: every firmware commit since the prebuilt must be released or attested
        run: python3 .github/scripts/check_prebuilt_freshness.py

  prebuilt-integrity:
    name: prebuilt integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Every shipped blob must match its own .sha256 manifest.  These are the
      # artifacts customers flash; a mismatch means the manifest, the binary or
      # both are wrong, and the flashing recipe in README tells people to verify
      # exactly this before writing to a part.
      - name: verify each prebuilt against its manifest
        run: |
          set -euo pipefail
          rc=0
          for bin in prebuilt/cc3501e-*.bin; do
            [ -e "$bin" ] || continue
            man="$bin.sha256"
            if [ ! -f "$man" ]; then
              echo "::error::$bin has no $man"; rc=1; continue
            fi
            want=$(tr -d '[:space:]' < "$man")
            have=$(sha256sum "$bin" | cut -d' ' -f1)
            if [ "$want" != "$have" ]; then
              echo "::error::$bin sha256 mismatch: manifest $want, actual $have"; rc=1
            else
              echo "ok  $bin  $have"
            fi
          done
          exit $rc

      # A blob's KIND matters as much as its hash.  prebuilt/ has shipped two
      # of them under one naming scheme -- a raw build_ti.ps1 image and a TI
      # flash-images-builder vendor_image -- and README's recipe copies the
      # blob straight in as primary_vendor_image.sign.bin, which is only
      # correct for the wrapped kind.  A raw blob there puts a bare Cortex-M
      # vector table where the programmer expects a signed container: not a
      # different build of the right thing, a different file format (#96).
      #
      # prebuilt/BUILD_RECIPE.md records which release is which in prose; this
      # makes that record machine-checked, and also fails a NEW release whose
      # kind nobody wrote down.
      - name: each prebuilt's artifact kind matches BUILD_RECIPE.md
        run: python3 .github/scripts/check_prebuilt_kind.py
